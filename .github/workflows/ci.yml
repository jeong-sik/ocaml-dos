name: Core CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a PR replaces its old run. Each push to main gets a group
# of its own: a group holds one running and one pending run, and a push
# whose event arrives late would otherwise cancel or replace the run of a
# newer merge commit (#169).
concurrency:
  group: core-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'
      - run: opam install . --deps-only --with-test -y
      - run: opam exec -- dune build @all
      - run: opam exec -- dune runtest
